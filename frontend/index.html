<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FrameSpace — Design your perfect room in 3D with AI-powered furniture recommendations" />
    <title>FrameSpace — 3D Room Designer</title>
    <!-- Block-rendering theme init: prevents flash of unstyled content on dark mode -->
    <script>
      (function(){
        var t=localStorage.getItem('fs-theme');
        if(t==='dark'||(t===null&&window.matchMedia('(prefers-color-scheme: dark)').matches)){
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-[9999] focus:bg-white focus:text-brand-dark focus:px-4 focus:py-2 focus:rounded-lg focus:shadow-lg focus:font-medium">
      Skip to content
    </a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
